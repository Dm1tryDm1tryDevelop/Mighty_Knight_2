function showAllies(){const cs=[300,800,1800];let r='';cs.forEach((c,i)=>{r+=`<div class="sk"><span>${save.al[i]?'🛡️':'➕'}</span>Союзник ${i+1}<small><button class="mb sm" data-al="${i}" ${save.al[i]||save.gold<c?'disabled':''}>${save.al[i]?'Нанят':c+' 🪙'}</button></small></div>`});panel(`<div class="panel" style="width:min(420px,94vw)"><h2>Союзники</h2><div style="text-align:center;margin-bottom:6px">🪙 ${save.gold}</div>${r}<div class="col" style="margin-top:10px"><button class="mb sm" data-a="heroes">Назад</button></div></div>`)}
function showOnline(){panel(`<div class="col"><h2>Онлайн</h2><button class="mb pr" data-a="create">Создать комнату</button><div class="row"><input id="code" maxlength="4" placeholder="КОД"><button class="mb sm" data-a="join">Войти</button></div><button class="mb sm" data-a="main">Назад</button></div>`)}
function showLobby(){G.st='lobby';const ids=Object.keys(NET.LB);let s='';for(let i=0;i<4;i++){const id=ids[i],q=id&&NET.LB[id];s+=q?`<div class="slot ${id===NET.id||id==='h'&&NET.host?'me':''}"><canvas width="80" height="90" data-pv="${q.h}" data-lv="${q.lv}"></canvas><div>${HD[q.h].n} · ур. ${q.lv}</div><small>${id==='h'?'Хозяин':'Игрок'}</small></div>`:'<div class="slot" style="opacity:.35;padding-top:46px">Свободно</div>'}
let c='';[0,1,2,3].forEach(h=>c+=chip(h,save.hero==h,save.lv[h]));
panel(`<div class="col"><h2>Комната</h2><div class="code">${NET.code}</div><div class="slots">${s}</div><div class="row">${c}</div><div class="row"><button class="mb sm" data-a="main">Выйти</button>${NET.host?`<button class="mb pr sm" data-a="go" ${ids.length<2?'disabled':''}>Начать</button>`:'<span>Ждём хозяина…</span>'}</div></div>`);ov.querySelectorAll('canvas[data-pv]').forEach(cn=>pv(cn,{x:cn.width/2,y:cn.height-6,dir:1,s:cn.width>70?1.25:.95,wk:0,mv:0,p:0,as:1,hurt:0,k:+cn.dataset.pv,t:tierOf(+cn.dataset.lv)}))}
function pickHero(h){save.hero=h;store();if(G.st==='lobby'){NET.LB[NET.id]={h,lv:save.lv[h]};if(NET.host)bcLB();else NET.send({t:'hi',h,lv:save.lv[h]});showLobby()}else if(ov.querySelector('.map'))showMap();else showHeroes()}
ov.addEventListener('click',e=>{ac();const hh=e.target.closest('[data-hero]');if(hh){snd('tick');pickHero(+hh.dataset.hero);return}const st=e.target.closest('[data-st]');if(st){if(save.best>=st.dataset.st*5){selStage=+st.dataset.st;snd('tick');showMap()}return}
const b=e.target.closest('button');if(!b||b.disabled)return;snd('tick');const d=b.dataset;
if(d.al!==undefined){const c=[300,800,1800][d.al];if(save.gold>=c){save.gold-=c;save.al[d.al]=1;store();showAllies()}return}
switch(d.a){case'map':showMap();break;case'heroes':showHeroes();break;case'main':showMain();break;case'ally':showAllies();break;case'onl':showOnline();break;
case'snd':save.mute^=1;if(AU.m)AU.m.gain.value=save.mute?0:.6;store();showMain();break;
case'start':startRun({stage:selStage});break;
case'up':{const l=save.lv[save.hero],c=lvCost(l);if(l<12&&save.gold>=c){save.gold-=c;save.lv[save.hero]++;store();snd('up');const d=HD[save.hero],nl=l+1,sk=d.sk.find(x=>x[3]===nl);showHeroes(sk?'Новый навык: '+sk[0]:tierOf(nl)>tierOf(l)?'Новый облик!':'Уровень '+nl,1)}break}
case'create':hostRoom();break;case'join':{const c=($('code').value||'').trim();if(c.length>=3)joinRoom(c)}break;
case'go':if(NET.host&&Object.keys(NET.conns).length){NET.send({t:'go',s:selStage});G.on=1;startRun({on:1,host:true,stage:selStage})}break;
case'resume':G.pause=0;ov.style.display='none';break}});
showMain();let lt=performance.now();
(function loop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;update(dt);if(G.st!=='play'){PV.forEach(v=>{if(!v.c.isConnected)return;const a=(G.t%2.6)/2.6;v.o.p=a<.3?a/.3:0;v.o.as=1+(Math.floor(G.t/2.6)%3);pv(v.c,v.o);if(v.b>0){const c=v.c.getContext('2d');c.save();c.globalCompositeOperation='lighter';c.strokeStyle='rgba(255,220,100,'+v.b+')';c.lineWidth=5;c.beginPath();c.arc(v.c.width/2,v.c.height*.6,(1-v.b)*100,0,7);c.stroke();for(let i=0;i<8;i++){const an=i*.785+v.b*3,r=(1-v.b)*90;c.fillStyle='rgba(255,230,140,'+v.b+')';c.fillRect(v.c.width/2+Math.cos(an)*r,v.c.height*.6+Math.sin(an)*r,4,4)}c.restore();v.b-=.025}})}draw();ui();requestAnimationFrame(loop)})(lt);
</script></body></html>
